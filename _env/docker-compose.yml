services:
  mysql:
    image: mysql:8.4
    container_name: phpcourse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: phpcourse
      MYSQL_USER: phpcourse
      MYSQL_PASSWORD: phpcourse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - phpcourse-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: phpcourse-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  phpcourse-mysql-data:
